services:
  postgres:
    image: postgres:16-alpine
    container_name: meuingresso-postgres-dev
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-4444}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - meuingresso-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meuingresso-backend-dev
    restart: always
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3333}:3333"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: ${APP_PORT:-3333}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      TMDB_API_KEY: ${TMDB_API_KEY}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - meuingresso-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meuingresso-frontend-dev
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - meuingresso-net

volumes:
  postgres_dev_data:

networks:
  meuingresso-net:
    driver: bridge
